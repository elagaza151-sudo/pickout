name: PICK & OUT encrypted daily database backup to R2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pickout-database-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.PICKOUT_BACKUP_DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.PICKOUT_R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.PICKOUT_R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PICKOUT_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PICKOUT_R2_SECRET_ACCESS_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.PICKOUT_BACKUP_PASSPHRASE }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY BACKUP_PASSPHRASE; do
            if [[ -z "${!key:-}" ]]; then echo "::error::Missing secret for $key"; exit 1; fi
          done
      - name: Create PostgreSQL 17 dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pickout-backup"
          chmod 700 "$RUNNER_TEMP/pickout-backup"
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "$RUNNER_TEMP/pickout-backup:/backup" \
            postgres:17 \
            sh -ec 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/database.dump && pg_restore --list /backup/database.dump >/dev/null'
      - name: Encrypt and upload backup
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pickout-backup"
          test -s database.dump
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          key="pickout/postgres/${stamp}-run${GITHUB_RUN_ID}.dump.enc"
          printf '%s' "$BACKUP_PASSPHRASE" > passphrase
          chmod 600 passphrase
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in database.dump -out database.dump.enc -pass file:passphrase
          sha256sum database.dump.enc > database.dump.enc.sha256
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws --endpoint-url "$endpoint" s3 cp database.dump.enc "s3://${R2_BUCKET}/${key}" --no-progress
          aws --endpoint-url "$endpoint" s3 cp database.dump.enc.sha256 "s3://${R2_BUCKET}/${key}.sha256" --no-progress
          remote_size="$(aws --endpoint-url "$endpoint" s3api head-object --bucket "$R2_BUCKET" --key "$key" --query ContentLength --output text)"
          local_size="$(stat -c %s database.dump.enc)"
          test "$remote_size" = "$local_size"
          echo "Backup uploaded and remote size verified: $key"
          rm -f database.dump database.dump.enc database.dump.enc.sha256 passphrase
