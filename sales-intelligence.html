<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📈 Sales Intelligence | PICK & OUT</title><style>body{background:#17120f;color:#f4e8d9;font:16px Tahoma,Arial;margin:0;padding:25px}main{max-width:1050px;margin:auto}a{color:#e8b77c}h1{color:#f3c38c}.card{background:#291e17;border:1px solid #5c3d2b;border-radius:15px;padding:20px;margin:14px 0}button,input{padding:12px;background:#3c2a20;color:#fff;border:1px solid #805b40;border-radius:9px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #63432b;text-align:right}.muted{color:#c7b6a5}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><a href="./index.html">← لوحة التحكم</a><h1>📈 Sales Intelligence</h1><p id="notice" class="muted">جارٍ التأكد من صلاحيات المدير...</p><div id="content" hidden><div class="card"><h2>مؤشرات مبيعات اليوم</h2><div id="stats"></div></div><div class="card"><h2>المنتجات الأكثر مبيعًا</h2><div id="products"></div></div></div></main><script>(async()=>{const db=window.supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq');const {data:{user}}=await db.auth.getUser();if(!user){location.href='./index.html';return}const {data:p}=await db.from('profiles').select('role,is_active').eq('id',user.id).maybeSingle();if(!p?.is_active||!['admin','manager'].includes(p.role)){document.getElementById('notice').textContent='هذه الصفحة للمدير فقط';return}document.getElementById('content').hidden=false;document.getElementById('notice').textContent='';const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const from=new Date();from.setHours(0,0,0,0);const {data,error}=await db.from('orders').select('id,total,payment_status,status,order_items(product_name,quantity)').gte('created_at',from.toISOString()).limit(5000);if(error)throw error;const paid=(data||[]).filter(x=>x.payment_status==='paid'&&x.status!=='cancelled'),total=paid.reduce((a,x)=>a+Number(x.total||0),0);document.getElementById('stats').textContent='الطلبات المدفوعة: '+paid.length+' | إجمالي المبيعات: '+total.toFixed(2)+' ج.م | متوسط الطلب: '+(paid.length?total/paid.length:0).toFixed(2)+' ج.م';const items=new Map();for(const o of paid)for(const item of o.order_items||[])items.set(item.product_name,(items.get(item.product_name)||0)+Number(item.quantity||0));document.getElementById('products').innerHTML=[...items].sort((a,b)=>b[1]-a[1]).slice(0,12).map(([name,qty])=>'<p>'+esc(name)+' — '+qty+'</p>').join('')||'لا توجد مبيعات اليوم';})().catch(e=>document.getElementById('notice').textContent=e.message);</script></body></html>
