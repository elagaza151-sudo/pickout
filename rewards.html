<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استبدال النقاط | PICK & OUT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:radial-gradient(circle at top,#4b2b1a,#160f0b 70%);color:#fff;font:16px Tahoma,Arial;margin:0;padding:20px}main{max-width:800px;margin:auto}.card{background:#342219;border:1px solid #77513a;border-radius:16px;padding:22px;margin:18px 0}button{background:#168c51;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}input{background:#1d130e;color:white;border:1px solid #8c6546;padding:12px;border-radius:9px;margin:5px}a{color:#8ff3b4}h1{color:#eec38e}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #63432e;padding:14px 0}.muted{color:#d0b6a5}</style><main><a href="./#games">← رجوع للموقع</a><h1>🎁 استبدال النقاط</h1><p>استبدل نقاطك بمكافآت PICK & OUT اللي المدير بيحددها.</p><div class="card" id="login"><h2>الدخول باستخدام Google</h2><p>سجل بنفس حساب Google اللي بتلعب بيه علشان تستبدل نقاطك.</p><button style="background:#fff;color:#333" onclick="googleLogin()">متابعة باستخدام Google</button><p id="loginError" class="muted"></p></div><div class="card" id="account" hidden><b id="who"></b> — رصيدك <b id="points"></b> نقطة <button onclick="restore()">↻ تحديث الرصيد</button> <button onclick="logout()">خروج</button><p id="pointsHelp" class="muted"></p></div><div class="card"><h2>المكافآت المتاحة</h2><div id="rewards">جاري التحميل...</div><p class="muted">بعد الاستبدال، بيظهر الطلب عند المدير للتسليم. النقاط بتتخصم عند تأكيد الطلب.</p></div></main><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let user=null;
function show(){if(!user?.token)return;$('login').hidden=true;$('account').hidden=false;$('who').textContent=user.name;$('points').textContent=Number(user.points||0);$('pointsHelp').textContent=Number(user.points||0)>0?'الرصيد مأخوذ مباشرة من حساب ألعاب Google المرتبط.':'رصيد حساب ألعاب Google الحالي صفر. اتأكد إنك داخل بنفس حساب Google اللي جمعت عليه النقاط؛ نقاط مشتريات الكاشير نظام منفصل.'}
async function googleLogin(){const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)$('loginError').textContent=error.message}
async function restore(){const {data:{session},error:sessionError}=await db.auth.getSession();if(sessionError){$('loginError').textContent=sessionError.message;return}if(!session?.user){$('login').hidden=false;$('account').hidden=true;return}const {data,error}=await db.rpc('arcade_google_login');if(error){$('loginError').textContent='تعذر تحديث رصيد النقاط: '+error.message;return}if(!data?.token){$('loginError').textContent='لم يتم تحميل حساب النقاط، حاول تسجيل الدخول مرة أخرى';return}user=data;localStorage.setItem('arcadeUser',JSON.stringify(user));$('loginError').textContent='';show()}
async function logout(){localStorage.removeItem('arcadeUser');await db.auth.signOut();location.reload()}
async function redeem(id){if(!user?.token)return alert('سجل دخولك الأول');if(!confirm('متأكد إنك عايز تستبدل نقاطك؟'))return;const {data,error}=await db.rpc('arcade_redeem',{p_player:user.id,p_token:user.token,p_reward:id});if(error)return alert(error.message);user.points=Number(data.remaining??user.points);localStorage.setItem('arcadeUser',JSON.stringify(user));show();await restore();alert('تم تسجيل طلب الاستبدال رقم '+data.redemption_id+'، اطلبه من الموظف')}
async function load(){const {data,error}=await db.from('arcade_rewards').select('id,title,cost').eq('active',true).order('cost');$('rewards').innerHTML=error?'تعذر تحميل المكافآت':data.length?data.map(r=>'<div class="item"><div><b>'+safe(r.title)+'</b><p>'+r.cost+' نقطة</p></div><button onclick="redeem('+r.id+')">استبدال</button></div>').join(''):'المدير لسه ما أضافش مكافآت للاستبدال'}db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED')restore();if(event==='SIGNED_OUT'){user=null;$('login').hidden=false;$('account').hidden=true}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&user)restore()});restore();load();
</script>
