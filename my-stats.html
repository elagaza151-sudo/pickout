<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Coffee Stats</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px Tahoma;background:#1d120e;color:#fff;padding:24px}main{max-width:800px;margin:auto}.card{background:#39251b;border-radius:14px;padding:20px;margin:15px 0}button{background:#16864d;color:white;padding:12px;border:0;border-radius:9px;cursor:pointer}input{padding:12px;margin:5px;border-radius:8px}a{color:#8feeb5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}</style><main><a href="./">الرئيسية</a><h1>📊 My Coffee Stats</h1><div id="login" class="card"><button onclick="login()">تسجيل Google</button></div><div id="dashboard" hidden><div class="card"><h2>إحصائياتي</h2><div class="grid"><p>🧾 الطلبات: <b id="orders">0</b></p><p>💰 إجمالي المشتريات: <b id="spent">0</b></p><p>🎮 مرات اللعب: <b id="plays">0</b></p><p>⭐ النقاط: <b id="points">0</b></p></div><h3>☕ المشروب المفضل: <span id="favorite">—</span></h3></div><div class="card"><h2>ربط الطلبات السابقة</h2><p>الطلبات القديمة تحتاج ربطًا يدويًا برقم الطلب والموبايل.</p><input id="number" type="number" placeholder="رقم الطلب"><input id="phone" type="tel" placeholder="رقم الموبايل"><button onclick="claim()">ربط الطلب</button><p id="msg"></p></div><a href="./arcade.html#achievements">أوسمتي وإنجازاتي</a></div></main><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=id=>document.getElementById(id);
async function login(){const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)alert(error.message)}
async function refresh(){const {data,error}=await db.rpc('my_coffee_stats');if(error){$('msg').textContent=error.message;return}for(const k of ['orders','spent','plays','points'])$(k).textContent=data[k]||0;$('favorite').textContent=data.favorite||'اربط طلباتك الأول'}
async function claim(){const n=Number($('number').value),p=$('phone').value.trim();if(!Number.isSafeInteger(n)||n<1||!/^01[0125][0-9]{8}$/.test(p)){$('msg').textContent='اكتب رقم طلب ورقم موبايل صحيح';return}const {error}=await db.rpc('claim_my_order',{p_order_number:n,p_phone:p});$('msg').textContent=error?error.message:'تم ربط الطلب';if(!error)refresh()}
async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return;$('login').hidden=true;$('dashboard').hidden=false;await db.rpc('arcade_google_login');refresh()}init();
</script>
