<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift a Coffee | PICK & OUT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{background:#21140e;color:white;font:16px Tahoma;padding:20px}main{max-width:780px;margin:auto}.card{background:#39271b;padding:22px;margin:15px 0;border-radius:15px}input,textarea{display:block;padding:12px;margin:10px 0;width:90%;max-width:420px;background:#160e0b;color:white;border:1px solid #947154;border-radius:9px}button{background:#16874c;color:white;padding:12px 18px;border:0;border-radius:9px;cursor:pointer}a{color:#92eeb9}#qr{background:white;padding:12px;display:inline-block}</style><main><a href="./">الرئيسية</a><h1>🎁 Gift a Coffee</h1><p>اختار مشروب من المنيو واطلبه بالطريقة المعتادة، وبعدها حوّل الطلب لهدية لصاحبك. الكود يتفعل بعد ما الكافيه يؤكد الدفع.</p><a href="./#menu">☕ اطلب المشروب من المنيو</a><div class="card"><h2>حوّل طلبك لهدية</h2><input id="number" type="number" placeholder="رقم الطلب"><input id="phone" type="tel" placeholder="رقم الموبايل المستخدم في الطلب"><input id="recipient" placeholder="اسم صاحب الهدية"><textarea id="message" maxlength="300" placeholder="رسالة لطيفة لصاحبك"></textarea><button onclick="create()">إنشاء كود الهدية</button><p id="status"></p></div><div id="result" class="card" hidden><h2>🎉 كارت الهدية</h2><p id="details"></p><div id="qr"></div><p id="code"></p><button onclick="copyCode()">نسخ كود الهدية</button><p>الهدية تفضل معلّقة لحد ما المدير يراجع الدفع ويفعّلها.</p></div><div class="card"><h2>التحقق من حالة هدية</h2><input id="lookup" placeholder="كود الهدية"><button onclick="check()">تحقق</button><p id="checkStatus"></p></div></main><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=x=>document.getElementById(x);let code='';
async function create(){const n=Number($('number').value),phone=$('phone').value.trim(),recipient=$('recipient').value.trim();if(!Number.isSafeInteger(n)||n<1||!/^01[0125][0-9]{8}$/.test(phone)||recipient.length<2){$('status').textContent='راجع رقم الطلب والموبايل واسم صاحب الهدية';return}const r=await db.rpc('create_coffee_gift',{p_order_number:n,p_phone:phone,p_recipient:recipient,p_message:$('message').value});if(r.error){$('status').textContent=r.error.message;return}code=r.data.code;$('status').textContent='تم إنشاء كود الهدية';$('result').hidden=false;$('details').textContent='إلى '+r.data.recipient+' — '+(r.data.message||'مع أحلى تمنياتنا');$('code').textContent='كود الهدية: '+code;$('qr').innerHTML='';if(window.QRCode)new QRCode($('qr'),{text:code,width:170,height:170})}
function copyCode(){if(code)navigator.clipboard.writeText(code)}
async function check(){const r=await db.rpc('gift_status',{p_code:$('lookup').value.trim()});$('checkStatus').textContent=r.error?'تعذر التحقق':!r.data?'الكود غير موجود':'الحالة: '+({pending:'في انتظار تأكيد الدفع',active:'الهدية جاهزة للاستلام',redeemed:'تم استخدام الهدية',cancelled:'تم إلغاء الهدية'}[r.data.status]||r.data.status)}
</script>
