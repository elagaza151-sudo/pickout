<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICK & OUT Arcade</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#1b110e;color:#fff;font:16px Tahoma;margin:0;padding:20px}main{max-width:900px;margin:auto}.box{background:#342219;border:1px solid #82583a;border-radius:16px;padding:20px;margin:15px 0}button{background:#13844a;color:white;border:0;border-radius:10px;padding:12px;margin:5px;cursor:pointer}input{padding:12px;border-radius:9px;margin:5px;background:#20140f;color:white;border:1px solid #987351}h1{color:#e9bd7c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.hide{display:none}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:430px}#cards button{height:65px;font-size:28px}#arena{height:300px;background:#16442c;position:relative;overflow:hidden;touch-action:none}#cup{position:absolute;bottom:0;left:45%;font-size:40px}.drop{position:absolute;font-size:28px}table{width:100%}td,th{padding:8px;border-bottom:1px solid #654}a{color:#85e8aa}</style><main><a href="./">← الموقع الرئيسي</a><h1>🎮 PICK & OUT ARCADE</h1><div class="box" id="login"><h2>سجل باسمك ورقمك</h2><input id="name" placeholder="الاسم"><input id="phone" placeholder="رقم الموبايل" inputmode="tel"><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="رمز سري 6 أرقام"><button onclick="register()">دخول / تسجيل</button><p>احتفظ بالرمز السري، رقمك مش بيظهر للناس.</p></div><div class="box hide" id="account"><b id="who"></b> · <span id="points"></span> نقطة <button onclick="localStorage.removeItem('arcadeUser');location.reload()">خروج</button></div><div class="box"><h2>🏆 ترتيب الأسبوع</h2><p id="prize"></p><div id="leaders"></div></div><div class="box"><h2>الألعاب</h2><div class="grid"><div><h3>🧠 Coffee Memory</h3><button onclick="start('memory')">العب</button></div><div><h3>☕ Catch the Coffee</h3><button onclick="start('catch')">العب</button></div><div><h3>⏱️ Barista Rush</h3><button onclick="start('barista')">العب</button></div><div><h3>🥤 Guess the Drink</h3><button onclick="start('guess')">العب</button></div></div></div><div class="box hide" id="play"><h2 id="title"></h2><p id="clock"></p><div id="area"></div><p id="msg"></p><button onclick="end()">إغلاق</button></div><div class="box"><h2>🎁 استبدال النقاط</h2><div id="rewards"></div></div></main><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let user=JSON.parse(localStorage.getItem('arcadeUser')||'null'),game='',score=0,secs=0,timer=null,interval=null,active=false;
function display(){if(!user)return;$('login').classList.add('hide');$('account').classList.remove('hide');$('who').textContent=user.name;$('points').textContent=user.points}display();
async function register(){const {data,error}=await db.rpc('arcade_register',{p_name:$('name').value,p_phone:$('phone').value,p_pin:$('pin').value});if(error)return alert(error.message);user=data;localStorage.setItem('arcadeUser',JSON.stringify(user));display()}
async function load(){const [a,b,c]=await Promise.all([db.rpc('arcade_leaderboard'),db.from('arcade_rewards').select('id,title,cost').eq('active',true),db.from('arcade_settings').select('*').single()]);$('prize').textContent='جائزة المركز الأول: '+(c.data?.weekly_prize||'يحددها المدير');$('leaders').innerHTML=a.error?a.error.message:'<table><tr><th>المركز</th><th>الاسم</th><th>النتيجة</th></tr>'+(a.data||[]).map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+safe(x.name)+'</td><td>'+x.total+'</td></tr>').join('')+'</table>';$('rewards').innerHTML=b.error?b.error.message:(b.data||[]).map(x=>'<p>'+safe(x.title)+' — '+x.cost+' نقطة <button onclick="redeem('+x.id+')">استبدال</button></p>').join('')||'المكافآت لسه المدير ما حددهاش'}
async function redeem(id){if(!user)return alert('سجل الأول');if(!confirm('تأكيد الاستبدال؟'))return;const {data,error}=await db.rpc('arcade_redeem',{p_player:user.id,p_token:user.token,p_reward:id});if(error)return alert(error.message);user.points=data.remaining;localStorage.setItem('arcadeUser',JSON.stringify(user));display();alert('تم تسجيل طلبك رقم '+data.redemption_id+'، استلمه من الكافيه')}
function clear(){active=false;clearInterval(timer);clearInterval(interval);document.onkeydown=null}
function end(){clear();$('play').classList.add('hide')}
function start(g){if(!user)return alert('سجل الأول');clear();game=g;score=0;active=true;$('play').classList.remove('hide');$('title').textContent={memory:'🧠 Coffee Memory',catch:'☕ Catch the Coffee',barista:'⏱️ Barista Rush',guess:'🥤 Guess the Drink'}[g];$('msg').textContent='';$('area').innerHTML='';$('play').scrollIntoView();if(g==='memory')memory();else if(g==='catch')catchGame();else quiz(g)}
function countdown(n){secs=n;$('clock').textContent='الوقت: '+secs;timer=setInterval(()=>{secs--;$('clock').textContent='الوقت: '+secs;if(secs<=0){if(game==='memory')score=0;finish()}},1000)}
async function finish(){if(!active)return;clear();$('area').innerHTML='<h2>نتيجتك: '+score+'</h2>';$('msg').textContent='جاري تسجيل النتيجة';const {data,error}=await db.rpc('arcade_submit',{p_player:user.id,p_token:user.token,p_game:game,p_score:score});if(error){$('msg').textContent='النتيجة لم تسجل: '+error.message;return}user.points=data.points;localStorage.setItem('arcadeUser',JSON.stringify(user));display();$('msg').textContent='تم التسجيل! كسبت '+data.earned+' نقطة';load()}
function memory(){let arr=[...'☕🍰🍓🍋🍪🍫🍒🍇'];arr=[...arr,...arr].sort(()=>Math.random()-.5);let open=[],found=0,moves=0;$('area').innerHTML='<div id="cards">'+arr.map((x,i)=>'<button data-i="'+i+'">❔</button>').join('')+'</div>';countdown(75);$('cards').onclick=e=>{let b=e.target.closest('[data-i]');if(!b||!active||b.disabled||open.length===2)return;b.textContent=arr[+b.dataset.i];open.push(b);if(open.length===2){moves++;let [a,c]=open;if(arr[+a.dataset.i]===arr[+c.dataset.i]){a.disabled=c.disabled=true;open=[];found++;if(found===8){score=Math.min(1200,1000-moves*15+secs*4);finish()}}else setTimeout(()=>{if(!active)return;a.textContent=c.textContent='❔';open=[]},600)}}}
function catchGame(){countdown(30);let x=45,drops=[];$('area').innerHTML='<p>حرّك الكوب بإصبعك أو بأسهم الكيبورد</p><div id="arena"><span id="cup">☕</span></div><h3 id="result">0</h3>';let a=$('arena');function move(v){x=Math.max(0,Math.min(88,v));$('cup').style.left=x+'%'}a.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')move((e.clientX-a.getBoundingClientRect().left)/a.clientWidth*100)};a.onpointerdown=e=>move((e.clientX-a.getBoundingClientRect().left)/a.clientWidth*100);document.onkeydown=e=>{if(e.key==='ArrowLeft')move(x-9);if(e.key==='ArrowRight')move(x+9)};interval=setInterval(()=>{if(!active)return;if(Math.random()<.4){let el=document.createElement('span'),bad=Math.random()<.2;el.className='drop';el.textContent=bad?'🔥':'🫘';el.style.left=Math.random()*88+'%';a.appendChild(el);drops.push({el,bad,y:0})}drops=drops.filter(d=>{d.y+=9;d.el.style.top=d.y+'px';if(d.y>245){if(Math.abs(parseFloat(d.el.style.left)-x)<12)score=Math.max(0,Math.min(1500,score+(d.bad?-40:30)));$('result').textContent=score;d.el.remove();return false}return true})},100)}
const drinks=[['لاتيه','حليب'],['موهيتو','نعناع'],['هوت شوكليت','شوكولاتة'],['آيس كوفي','قهوة'],['مانجو','مانجو'],['ليمون نعناع','ليمون'],['سبانش لاتيه','حليب مكثف'],['أوريو ميلك شيك','أوريو']];
function quiz(g){let n=0;countdown(g==='barista'?60:55);function next(){if(!active)return;if(n===10)return finish();let q=drinks[Math.floor(Math.random()*drinks.length)],correct=g==='barista'?q[1]:q[0],choices=[correct,...drinks.filter(d=>d[0]!==q[0]).sort(()=>Math.random()-.5).slice(0,3).map(d=>g==='barista'?d[1]:d[0])].sort(()=>Math.random()-.5);$('area').innerHTML='<h3>'+(g==='barista'?'طلب '+safe(q[0])+'، اختار المكون الأساسي':'مشروب مرتبط بـ '+safe(q[1])+'، اسمه إيه؟')+'</h3>'+choices.map(x=>'<button data-answer="'+safe(x)+'">'+safe(x)+'</button>').join('')+'<p>السؤال '+(n+1)+'/10 — النتيجة '+score+'</p>';$('area').onclick=e=>{let b=e.target.closest('[data-answer]');if(!b)return;score+=b.dataset.answer===correct?(g==='barista'?150:100):0;n++;next()}}next()}load();
</script>
