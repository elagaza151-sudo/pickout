<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Deals</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#21130d;color:white;font:16px Tahoma;padding:20px}main{max-width:800px;margin:auto}.card{background:#38251a;padding:20px;margin:14px 0;border-radius:14px}button{padding:12px;background:#168b50;color:white;border:0;border-radius:9px}a{color:#9edfb5}</style><main><a href="./">الرئيسية</a><h1>⚡ Flash Deals</h1><p>عروض لفترة محدودة وعدد حجوزات محدد</p><div id="login" class="card"><button onclick="login()">دخول Google</button></div><div class="card"><h2>العروض المتاحة</h2><div id="deals"></div></div><div class="card"><h2>حجوزاتي</h2><div id="mine"></div></div><p>يتم تأكيد الخصم مع موظف الكافيه، ولا يطبق تلقائيًا في السلة.</p></main><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=x=>document.getElementById(x),safe=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let session=null;
async function login(){const r=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(r.error)alert(r.error.message)}
async function load(){const r=await db.rpc('active_flash_deals');$('deals').innerHTML=r.error?'تعذر التحميل':(r.data||[]).map(d=>'<div class="card"><h3>'+safe(d.title)+'</h3><p>'+safe(d.description)+'</p><p>متبقي '+d.remaining+' — ينتهي '+new Date(d.ends_at).toLocaleString('ar-EG')+'</p><button onclick="reserve('+d.id+')">احجز</button></div>').join('')||'لا توجد عروض حاليًا';if(session){const m=await db.rpc('my_flash_deal_claims');$('mine').innerHTML=(m.data||[]).map(c=>'<p>'+safe(c.title)+' — '+safe(c.promo_code)+' — رقم الحجز '+c.id+'</p>').join('')||'لا توجد حجوزات'}}
async function reserve(id){if(!session)return login();const r=await db.rpc('claim_flash_deal',{p_deal:id});if(r.error)return alert(r.error.message);alert('تم الحجز رقم '+r.data.claim_id);load()}
async function init(){const r=await db.auth.getSession();session=r.data.session;if(session){$('login').hidden=true;await db.rpc('arcade_google_login')}load()}init();setInterval(load,30000);
</script>
