<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة الطلب | PICK & OUT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:radial-gradient(circle at top,#493020,#140d0b 70%);color:#fff;font:16px Tahoma,Arial;margin:0;padding:20px}main{max-width:760px;margin:auto}.card{background:#2c1d15;border:1px solid #7b553c;border-radius:18px;padding:22px;margin:18px 0}input{background:#1a120f;color:white;border:1px solid #977151;padding:13px;border-radius:10px;max-width:100%;margin:5px}button{background:#15864d;color:white;border:0;padding:13px 20px;border-radius:10px;cursor:pointer}a{color:#86eab0}.steps{display:grid;gap:10px}.step{padding:15px;border:1px solid #644831;border-radius:12px;opacity:.55}.step.done{opacity:1;border-color:#2bbf76;background:#17412c}.step.current{opacity:1;border-color:#f2bf77;background:#49341c}small{color:#ccb7a7}h1{color:#f1c88f}</style><main><a href="./">← الموقع الرئيسي</a><h1>📦 متابعة طلبك</h1><p>تابع حالة الطلب من لحظة الاستلام لحد ما يبقى جاهز للاستلام من الكافيه.</p><div class="card"><label>رقم الطلب</label><input id="number" type="number" min="1" placeholder="مثال: 123" inputmode="numeric"><label>رقم الموبايل المسجل في الطلب</label><input id="phone" type="tel" placeholder="01..." inputmode="tel"><button onclick="track()">تابع طلبي</button><p id="notice"></p></div><div id="result" class="card" hidden><h2 id="orderTitle"></h2><p id="updated"></p><div id="steps" class="steps"></div><p><small>الحالة بتتحدث تلقائيًا كل 10 ثواني طول ما الصفحة مفتوحة.</small></p></div></main><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=id=>document.getElementById(id);let polling=null,lastStatus=null;const states=[['pending','🧾','تم استلام الطلب'],['accepted','✅','تم تأكيد الطلب'],['preparing','☕','جاري التحضير'],['ready','🎉','جاهز للاستلام'],['completed','📦','تم التسليم']];async function track(){const number=Number($('number').value),phone=$('phone').value.trim();if(!Number.isSafeInteger(number)||number<1||!/^[+0-9\s-]{10,17}$/.test(phone)){$('notice').textContent='اكتب رقم الطلب ورقم الموبايل بشكل صحيح';return}const {data,error}=await db.rpc('track_guest_order',{p_order_number:number,p_phone:phone});if(error){$('notice').textContent='تعذر تحميل الحالة، حاول تاني';return}if(!data){$('notice').textContent='مش لاقيين طلب مطابق للرقم والموبايل دول';$('result').hidden=true;return}$('notice').textContent='';$('result').hidden=false;$('orderTitle').textContent='طلب رقم #'+data.number;const i=states.findIndex(s=>s[0]===data.status);$('steps').innerHTML=data.status==='cancelled'?'<div class="step current">❌ تم إلغاء الطلب</div>':states.map((s,j)=>'<div class="step '+(j<i?'done':j===i?'current':'')+'">'+s[1]+' '+s[2]+'</div>').join('');$('updated').textContent='آخر تحديث: '+new Date(data.updated_at||data.created_at).toLocaleString('ar-EG');if(data.status!==lastStatus&&lastStatus!==null&&data.status==='ready')$('notice').textContent='🎉 طلبك جاهز للاستلام!';lastStatus=data.status;if(['completed','cancelled'].includes(data.status)){clearInterval(polling);polling=null}else if(!polling)polling=setInterval(()=>{if(!document.hidden)track()},10000)}
const params=new URLSearchParams(location.search);if(params.get('order'))$('number').value=params.get('order');try{if(sessionStorage.getItem('pickoutLastOrderPhone'))$('phone').value=sessionStorage.getItem('pickoutLastOrderPhone')}catch{}if($('number').value&&$('phone').value)track();
</script>
