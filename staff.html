<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickout | لوحة الموظفين</title><link rel="stylesheet" href="css/style.css"><style>body{background:#1b120d;color:#f5e8d2;font-family:Cairo,Tahoma,sans-serif}.staff-shell{max-width:1200px;margin:35px auto;padding:20px}.staff-top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.staff-actions{display:flex;gap:8px;flex-wrap:wrap}.staff-actions button,.order-card button{background:#d9a45f;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700}.order-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px;margin-top:24px}.order-card{background:#2b1d15;border:1px solid #71503a;border-radius:16px;padding:20px}.order-card h3{margin:0 0 10px}.order-card p{line-height:1.8}.order-card select{width:100%;padding:10px;border-radius:8px;margin:8px 0 12px;background:#3d291c;color:white}.notice{color:#e6b97b}.login-wrap[hidden],#dashboard[hidden]{display:none!important}</style></head><body><main class="login-wrap" id="loginArea"><a class="brand" href="index.html">PICKOUT</a><section class="login-card"><h1>دخول الموظفين</h1><form id="staffLogin"><label>اسم المستخدم</label><input id="username" autocomplete="username" required><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button class="primary-button full" type="submit">تسجيل الدخول</button><p id="loginMessage" role="status"></p></form></section></main><section class="staff-shell" id="dashboard" hidden><div class="staff-top"><div><h1>لوحة تشغيل Pickout</h1><p id="staffIdentity"></p></div><div class="staff-actions"><button id="soundToggle">🔔 الصوت: تشغيل</button><button id="refreshOrders">تحديث الطلبات</button><button id="logoutStaff">تسجيل خروج</button></div></div><p class="notice" id="dashboardMessage"></p><div class="order-grid" id="ordersGrid"></div></section><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/staff.js"></script></body></html>
