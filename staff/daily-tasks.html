<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>✅ Daily Tasks & Checklist | PICK & OUT</title><style>body{background:#17120f;color:#f4e8d9;font:16px Tahoma,Arial;margin:0;padding:25px}main{max-width:1050px;margin:auto}a{color:#e8b77c}h1{color:#f3c38c}.card{background:#291e17;border:1px solid #5c3d2b;border-radius:15px;padding:20px;margin:14px 0}button,input{padding:12px;background:#3c2a20;color:#fff;border:1px solid #805b40;border-radius:9px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #63432b;text-align:right}.muted{color:#c7b6a5}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><a href="./index.html">← لوحة التحكم</a><h1>✅ Daily Tasks & Checklist</h1><p id="notice" class="muted">جارٍ التأكد من صلاحيات المدير...</p><div id="content" hidden><div class="card"><h2>مهام تشغيل يومية</h2><p class="muted">القائمة محلية لهذا الجهاز، ولا تُستخدم لإثبات حضور الموظفين.</p><div id="tasks"></div><button id="reset">إعادة ضبط القائمة</button></div></div></main><script>(async()=>{const db=window.supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM');const {data:{user}}=await db.auth.getUser();if(!user){location.href='./index.html';return}const {data:p}=await db.from('profiles').select('role,is_active').eq('id',user.id).maybeSingle();if(!p?.is_active||!['admin','manager'].includes(p.role)){document.getElementById('notice').textContent='هذه الصفحة للمدير فقط';return}document.getElementById('content').hidden=false;document.getElementById('notice').textContent='';const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const tasks=['فحص نظافة منطقة التحضير','مراجعة المخزون والخامات الناقصة','التأكد من تشغيل الطابعة','مراجعة الطلبات المفتوحة','مطابقة المدفوعات في نهاية الشيفت','إقفال الشيفت وتسجيل التسوية'];const key='pickout-tasks-'+new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});let done={};try{done=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const render=()=>document.getElementById('tasks').innerHTML=tasks.map((t,i)=>'<label style="display:block;margin:13px 0"><input type="checkbox" data-task="'+i+'" '+(done[i]?'checked':'')+'> '+esc(t)+'</label>').join('');render();document.getElementById('tasks').onchange=e=>{if(e.target.dataset.task!==undefined){done[e.target.dataset.task]=e.target.checked;localStorage.setItem(key,JSON.stringify(done))}};document.getElementById('reset').onclick=()=>{done={};localStorage.removeItem(key);render()};})().catch(e=>document.getElementById('notice').textContent=e.message);</script></body></html>
