<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة العروض</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#18110e;color:#fff;font:16px Tahoma;padding:20px;max-width:900px;margin:auto}.card{background:#332219;border:1px solid #735139;border-radius:15px;padding:20px;margin:15px 0}input{padding:12px;background:#241711;color:white;border:1px solid #8a6548;border-radius:8px;margin:5px}button{background:#178b51;color:white;padding:11px;border:0;border-radius:8px;margin:4px;cursor:pointer}a{color:#8df0b5}</style><a href="./index.html">لوحة الموظفين</a><h1>⚡ إدارة Flash Deals</h1><p id="status">جاري التأكد من صلاحيات المدير...</p><div id="admin" hidden><div class="card"><h2>عرض جديد</h2><input id="title" placeholder="اسم العرض"><input id="description" placeholder="وصف العرض"><input id="code" placeholder="كود العرض"><p>البداية: <input id="starts" type="datetime-local"></p><p>النهاية: <input id="ends" type="datetime-local"></p><input id="quantity" type="number" min="1" placeholder="عدد الحجوزات"><button onclick="create()">إضافة العرض</button></div><div class="card"><h2>العروض</h2><div id="deals"></div></div><div class="card"><h2>حجوزات العملاء</h2><div id="claims"></div></div></div><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=x=>document.getElementById(x),safe=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function action(p_action,p_data){const r=await db.rpc('flash_deal_admin',{p_action,p_data});if(r.error)return alert(r.error.message);alert('تم الحفظ');load()}
async function create(){if(!$('title').value.trim()||!$('code').value.trim()||!$('starts').value||!$('ends').value||Number($('quantity').value)<1)return alert('اكمل بيانات العرض');action('create',{title:$('title').value,description:$('description').value,code:$('code').value,starts_at:new Date($('starts').value).toISOString(),ends_at:new Date($('ends').value).toISOString(),quantity:Number($('quantity').value)})}
async function load(){const r=await db.rpc('flash_deal_admin_data');if(r.error){$('status').textContent='للمدير فقط: '+r.error.message;return}$('status').textContent='لوحة إدارة العروض';$('admin').hidden=false;$('deals').innerHTML=(r.data.deals||[]).map(d=>'<p>'+safe(d.title)+' — '+d.claimed+'/'+d.quantity+' حجز — '+(d.active?'نشط':'موقوف')+(d.active?'<button onclick="action(\'disable\',{id:'+d.id+'})">إيقاف</button>':'')+'</p>').join('')||'لا توجد عروض';$('claims').innerHTML=(r.data.claims||[]).map(c=>'<p>حجز #'+c.id+' — '+safe(c.name)+' — '+safe(c.title)+' — '+safe(c.status)+(c.status==='reserved'?'<button onclick="action(\'use\',{id:'+c.id+'})">تم الاستخدام</button>':'')+'</p>').join('')||'لا توجد حجوزات'}load();
</script>
