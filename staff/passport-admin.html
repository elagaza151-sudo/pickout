<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffee Passport Rewards</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#1c120d;color:white;font:16px Tahoma;padding:24px;max-width:850px;margin:auto}.card{background:#38251b;border-radius:14px;padding:20px;margin:14px 0}button{background:#16874c;color:white;border:0;border-radius:8px;padding:11px}a{color:#9ee9b9}</style><a href="./index.html">لوحة الموظفين</a><h1>🌍 مكافآت Coffee Passport</h1><p>كل عميل يكمل 10 مشروبات مختلفة مدفوعة يحصل على كود مكافأة واحد. المدير يحدد نوع المكافأة خارج النظام، ويؤكد استلامها مرة واحدة.</p><p id="status"></p><div id="list"></div><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){const r=await db.rpc('passport_admin',{p_action:'list'});if(r.error){$('status').textContent=r.error.message;return}$('status').textContent='عدد المكافآت: '+r.data.length;$('list').innerHTML=r.data.map(x=>'<div class="card"><b>'+safe(x.name)+'</b><p>الكود: '+safe(x.reward_code)+'</p><p>الحالة: '+safe(x.status)+'</p>'+(x.status==='issued'?'<button onclick="redeem(\''+x.reward_code+'\')">تأكيد تسليم المكافأة</button>':'')+'</div>').join('')||'لا توجد مكافآت بعد'}
async function redeem(code){if(!confirm('هل سلمت المكافأة للعميل؟'))return;const r=await db.rpc('passport_admin',{p_action:'redeem',p_code:code});if(r.error)alert(r.error.message);else load()}load();
</script>
