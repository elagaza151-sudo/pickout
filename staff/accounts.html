<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICK & OUT | حسابات الموظفين</title><style>body{background:#17110e;color:#f8e7d5;font-family:system-ui;padding:30px;max-width:950px;margin:auto}input,select,button{padding:12px;margin:5px;background:#30221b;color:white;border:1px solid #80543a;border-radius:8px}button{background:#a66c42;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #604432}form{display:flex;flex-wrap:wrap}a{color:#edbb84}</style><h1>إدارة حسابات موظفين PICK & OUT</h1><p><a href="./">الرجوع للوحة الموظفين</a></p><p>سجّل دخول المدير من اللوحة الرئيسية أولًا. المدير فقط يقدر يضيف موظفين ويوقف الحسابات.</p><form id="form"><input name="display_name" placeholder="اسم الموظف" required><input name="username" placeholder="اسم المستخدم بالإنجليزي" required><input name="password" type="password" autocomplete="new-password" minlength="12" placeholder="باسورد جديد (12 حرف على الأقل)" required><select name="role"><option value="cashier">كاشير</option><option value="barista">باريستا</option><option value="manager">مدير تشغيل</option><option value="waiter">خدمة</option></select><button>إنشاء حساب</button></form><p id="message"></p><button id="refresh">تحديث الحسابات</button><table><thead><tr><th>الاسم</th><th>المستخدم</th><th>الصلاحية</th><th>الحالة</th><th>إدارة</th></tr></thead><tbody id="rows"></tbody></table><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="accounts.js"></script></html>
