<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICK & OUT | حسابات الموظفين</title><style>body{background:#17110e;color:#f8e7d5;font-family:system-ui;padding:30px;max-width:950px;margin:auto}input,select,button{padding:12px;margin:5px;background:#30221b;color:white;border:1px solid #80543a;border-radius:8px}button{background:#a66c42;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #604432}form{display:flex;flex-wrap:wrap}a{color:#edbb84}select{appearance:none;-webkit-appearance:none;min-width:180px;padding:13px 16px 13px 40px;background:#30221b;color:#fff;border:1px solid #a36b44;border-radius:12px;font-weight:700;cursor:pointer}select option{background:#241914;color:#fff;padding:12px}select:focus{outline:2px solid #e6a56a;outline-offset:2px}input{min-width:180px}form{align-items:center;gap:9px}.role-picker{position:relative;min-width:190px}.role-trigger{width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;background:#30221b;border:1px solid #a36b44;color:#f8e7d5;border-radius:12px;font-weight:700}.role-trigger span{color:#e9b37e;font-size:20px}.role-menu{position:absolute;z-index:50;top:calc(100% + 7px);right:0;left:0;background:#271b15;border:1px solid #9b6845;border-radius:13px;box-shadow:0 16px 35px #0009;padding:6px;max-height:230px;overflow:auto}.role-menu[hidden]{display:none}.role-menu button{display:block;text-align:right;width:100%;margin:0;padding:12px 14px;background:transparent;border:0;border-radius:8px;color:#f6e9d9}.role-menu button:hover,.role-menu button:focus-visible,.role-menu button[aria-selected="true"]{background:#805034;color:#fff;outline:none}</style><h1>إدارة حسابات موظفين PICK & OUT</h1><p><a href="./">الرجوع للوحة الموظفين</a></p><p>سجّل دخول المدير من اللوحة الرئيسية أولًا. المدير فقط يقدر يضيف موظفين ويوقف الحسابات.</p><form id="form"><input name="display_name" placeholder="اسم الموظف" required><input name="username" placeholder="اسم المستخدم بالإنجليزي" required><input name="password" type="password" autocomplete="new-password" minlength="12" placeholder="باسورد جديد (12 حرف على الأقل)" required><div class="role-picker"><input type="hidden" name="role" id="selectedRole" value="cashier"><button type="button" id="roleTrigger" class="role-trigger" aria-expanded="false" aria-controls="roleMenu">كاشير <span>⌄</span></button><div id="roleMenu" class="role-menu" hidden role="listbox"><button type="button" data-role="cashier" role="option" aria-selected="true">كاشير</button><button type="button" data-role="barista" role="option">باريستا</button><button type="button" data-role="manager" role="option">مدير تشغيل</button><button type="button" data-role="waiter" role="option">خدمة</button></div></div><button>إنشاء حساب</button></form><p id="message"></p><button id="refresh">تحديث الحسابات</button><table><thead><tr><th>الاسم</th><th>المستخدم</th><th>الصلاحية</th><th>الحالة</th><th>إدارة</th></tr></thead><tbody id="rows"></tbody></table><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="accounts.js"></script><script>(()=>{const t=document.getElementById("roleTrigger"),m=document.getElementById("roleMenu"),v=document.getElementById("selectedRole");function close(){m.hidden=true;t.setAttribute("aria-expanded","false")}t.addEventListener("click",()=>{m.hidden=!m.hidden;t.setAttribute("aria-expanded",String(!m.hidden))});m.querySelectorAll("[data-role]").forEach(b=>b.addEventListener("click",()=>{v.value=b.dataset.role;t.firstChild.textContent=b.textContent+" ";m.querySelectorAll("[data-role]").forEach(x=>x.setAttribute("aria-selected",String(x===b)));close()}));document.addEventListener("click",e=>{if(!e.target.closest(".role-picker"))close()});document.addEventListener("keydown",e=>{if(e.key==="Escape")close()})})();</script></html>
