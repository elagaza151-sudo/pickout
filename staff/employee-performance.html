<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📊 Employee Performance | PICK & OUT</title><style>body{background:#17120f;color:#f4e8d9;font:16px Tahoma,Arial;margin:0;padding:25px}main{max-width:1050px;margin:auto}a{color:#e8b77c}h1{color:#f3c38c}.card{background:#291e17;border:1px solid #5c3d2b;border-radius:15px;padding:20px;margin:14px 0}button,input{padding:12px;background:#3c2a20;color:#fff;border:1px solid #805b40;border-radius:9px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #63432b;text-align:right}.muted{color:#c7b6a5}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><a href="./index.html">← لوحة التحكم</a><h1>📊 Employee Performance</h1><p id="notice" class="muted">جارٍ التأكد من صلاحيات المدير...</p><div id="content" hidden><div class="card"><h2>أداء الفريق اليوم</h2><table><thead><tr><th>الموظف</th><th>الطلبات</th><th>المبيعات المسجلة</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>(async()=>{const db=window.supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM');const {data:{user}}=await db.auth.getUser();if(!user){location.href='./index.html';return}const {data:p}=await db.from('profiles').select('role,is_active').eq('id',user.id).maybeSingle();if(!p?.is_active||!['admin','manager'].includes(p.role)){document.getElementById('notice').textContent='هذه الصفحة للمدير فقط';return}document.getElementById('content').hidden=false;document.getElementById('notice').textContent='';const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const from=new Date();from.setHours(0,0,0,0);const [{data:orders,error},{data:profiles}]=await Promise.all([db.from('orders').select('created_by,total,payment_status,status').gte('created_at',from.toISOString()).limit(5000),db.from('profiles').select('id,display_name')]);if(error)throw error;const names=new Map((profiles||[]).map(x=>[x.id,x.display_name]));const grouped=new Map();for(const o of orders||[]){if(!o.created_by||o.status==='cancelled')continue;const a=grouped.get(o.created_by)||{count:0,total:0};a.count++;if(o.payment_status==='paid')a.total+=Number(o.total||0);grouped.set(o.created_by,a)}document.getElementById('rows').innerHTML=[...grouped].map(([id,a])=>'<tr><td>'+esc(names.get(id)||'موظف')+'</td><td>'+a.count+'</td><td>'+a.total.toFixed(2)+' ج.م</td></tr>').join('')||'<tr><td colspan="3">لا توجد طلبات اليوم</td></tr>';})().catch(e=>document.getElementById('notice').textContent=e.message);</script></body></html>
