<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الهدايا</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#1b120e;color:white;font:16px Tahoma;padding:24px;max-width:850px;margin:auto}.card{background:#36241b;border-radius:14px;padding:18px;margin:14px 0}button{padding:10px;background:#17894c;color:white;border:0;border-radius:8px;margin:5px}a{color:#9be8b4}</style><a href="./index.html">لوحة الموظفين</a><h1>🎁 إدارة هدايا القهوة</h1><p>تفعيل الهدايا بعد تأكيد الدفع في الكاشير، ثم تسجيل الاستلام بكود الهدية.</p><p id="status"></p><div id="list"></div><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=x=>document.getElementById(x),safe=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){const r=await db.rpc('coffee_gift_admin',{p_action:'list'});if(r.error){$('status').textContent='الصفحة للمدير فقط: '+r.error.message;return}$('status').textContent='الهدايا المسجلة: '+r.data.length;$('list').innerHTML=r.data.map(g=>'<div class="card"><b>هدية #'+g.order_number+' إلى '+safe(g.recipient_name)+'</b><p>كود: '+safe(g.gift_code)+'</p><p>الحالة: '+safe(g.status)+' — الدفع: '+safe(g.payment_status)+'</p>'+(g.status==='pending'?'<button onclick="act(\'activate\',\''+g.gift_code+'\')">تفعيل بعد الدفع</button>':'')+(g.status==='active'?'<button onclick="act(\'redeem\',\''+g.gift_code+'\')">تأكيد الاستلام</button>':'')+(g.status==='pending'||g.status==='active'?'<button onclick="act(\'cancel\',\''+g.gift_code+'\')">إلغاء</button>':'')+'</div>').join('')||'مفيش هدايا'}
async function act(a,code){if(!confirm('تأكيد الإجراء؟'))return;const r=await db.rpc('coffee_gift_admin',{p_action:a,p_code:code});if(r.error)alert(r.error.message);else load()}load();
</script>
