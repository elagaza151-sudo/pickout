<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Arcade</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#1a110d;color:white;font:16px Tahoma;padding:20px;max-width:850px;margin:auto}.box{background:#322219;border:1px solid #76513c;padding:20px;border-radius:15px;margin:15px 0}input{padding:12px;background:#1b120f;color:white;border:1px solid #967054;border-radius:8px;margin:5px}button{padding:12px;background:#167e49;color:white;border:0;border-radius:8px;cursor:pointer;margin:4px}a{color:#83e9a5}table{width:100%}td,th{border-bottom:1px solid #765;padding:8px}</style><a href="./index.html">← لوحة الموظفين</a><h1>🎮 إدارة الألعاب والمكافآت</h1><p id="status">جاري التأكد من صلاحية المدير...</p><div id="admin" hidden><div class="box"><h2>🏆 جائزة المركز الأول الأسبوعية</h2><input id="prize" placeholder="الجائزة"><h3>نقاط لكل 100 نقطة نتيجة في الألعاب</h3><input id="rate" type="number" min="0" max="100"><button onclick="settings()">حفظ الإعدادات</button></div><div class="box"><h2>🎁 إضافة مكافأة للاستبدال</h2><input id="title" placeholder="مثلاً: مشروب مجاني"><input id="cost" type="number" min="1" placeholder="عدد النقاط"><button onclick="reward()">إضافة</button><h3>المكافآت الحالية</h3><div id="rewards"></div></div><div class="box"><h2>📋 طلبات الاستبدال</h2><div id="requests"></div></div></div><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function call(p_action,p_payload){const {error}=await db.rpc('arcade_admin',{p_action,p_payload});if(error)alert(error.message);else{alert('تم الحفظ');load()} }async function settings(){call('settings',{prize:$('prize').value,rate:+$('rate').value})}async function reward(){if(!$('title').value.trim()||+$('cost').value<1)return alert('اكتب المكافأة وتكلفتها');call('reward',{title:$('title').value,cost:+$('cost').value})}async function load(){const {data,error}=await db.rpc('arcade_admin_data');if(error){$('status').textContent='لا يمكن الدخول إلا بحساب المدير المسجل في لوحة الموظفين: '+error.message;return}$('status').textContent='تم تسجيل الدخول كمدير';$('admin').hidden=false;const s=await db.from('arcade_settings').select('*').single();$('prize').value=s.data?.weekly_prize||'';$('rate').value=s.data?.points_per_100??1;$('rewards').innerHTML=(data.rewards||[]).map(r=>'<p>'+safe(r.title)+' — '+r.cost+' نقطة — '+(r.active?'متاحة <button onclick="call(\'disable\',{id:'+r.id+'})">إيقاف</button>':'موقوفة')+'</p>').join('')||'لا توجد مكافآت';$('requests').innerHTML='<table><tr><th>العميل</th><th>المكافأة</th><th>الحالة</th></tr>'+(data.redemptions||[]).map(r=>'<tr><td>'+safe(r.name)+'<br>'+safe(r.phone)+'</td><td>'+safe(r.title)+'</td><td>'+safe(r.status)+(r.status==='pending'?'<button onclick="call(\'fulfill\',{id:'+r.id+'})">تم التسليم</button>':'')+'</td></tr>').join('')+'</table>'}load();
</script>
