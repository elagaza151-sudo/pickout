<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Arcade</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#1a110d;color:white;font:16px Tahoma;padding:20px;max-width:850px;margin:auto}.box{background:#322219;border:1px solid #76513c;padding:20px;border-radius:15px;margin:15px 0}input{padding:12px;background:#1b120f;color:white;border:1px solid #967054;border-radius:8px;margin:5px}button{padding:12px;background:#167e49;color:white;border:0;border-radius:8px;cursor:pointer;margin:4px}a{color:#83e9a5}table{width:100%}td,th{border-bottom:1px solid #765;padding:8px}</style><a href="./index.html">← لوحة الموظفين</a><h1>🎮 إدارة الألعاب والمكافآت</h1><p id="status">جاري التأكد من صلاحية المدير...</p><div id="admin" hidden><div class="box"><h2>🏆 جائزة المركز الأول الأسبوعية</h2><p>نتائج جميع الألعاب تحدد الترتيب فقط؛ لا توجد نقاط استبدال من الألعاب.</p><input id="prize" placeholder="جائزة المركز الأول"><button onclick="settings()">حفظ الجائزة</button></div><div class="box"><h2>📅 الترتيب الأسبوعي</h2><label>بداية الأسبوع (الاثنين) <input id="week" type="date"></label><button onclick="weekly()">عرض الأسبوع</button><p id="range"></p><div id="ranking"></div></div></div><script>
const db=supabase.createClient('https://ybnujvjcqrrvacquedyr.supabase.co','sb_publishable_oFXCDAq2QHOvyFcZGAe7NA_hL-MBiAM'),$=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function call(p_action,p_payload){const {error}=await db.rpc('arcade_admin',{p_action,p_payload});if(error)alert(error.message);else{alert('تم الحفظ');load()} }async function settings(){await call('settings',{prize:$('prize').value,rate:0})}
async function weekly(){const {data,error}=await db.rpc('arcade_admin_weekly_results',{p_week:$('week').value||null});if(error){$('ranking').textContent=error.message;return}$('range').textContent='من '+data.week_start+' إلى '+data.week_end+' — الجائزة: '+(data.prize||'لم تحدد');$('ranking').innerHTML='<table><tr><th>المركز</th><th>اللاعب</th><th>مجموع أفضل النتائج</th></tr>'+(data.ranking||[]).map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+safe(r.name)+'</td><td>'+r.total+'</td></tr>').join('')+'</table>'}
async function load(){const {data,error}=await db.rpc('arcade_admin_data');if(error){$('status').textContent='لا يمكن الدخول إلا بحساب المدير: '+error.message;return}$('status').textContent='تم تسجيل الدخول كمدير';$('admin').hidden=false;const x=await db.from('arcade_settings').select('*').single();$('prize').value=x.data?.weekly_prize||'';await weekly()}
load();
</script>
